<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/documents.css">
  <script src="js/brand.js"></script>
</head>
<body data-page="documents">
  <div id="site-header"></div>

  <main class="page page--compact">
    <div class="docs-head">
      <div>
        <h1 class="page__title docs-title">Client documents</h1>
        <p class="docs-lede">Everything you and your specialist have shared. Select a file to view it.</p>
      </div>
      <a class="btn btn--primary docs-upload" href="application.html?section=documents">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        Upload documents
      </a>
    </div>

    <div class="files-stack">
      <section class="files-card" aria-labelledby="advisor-files-title">
        <header class="files-card__header">
          <h2 class="files-card__title" id="advisor-files-title">
            Advisor uploaded documents
            <span class="files-card__count" data-count="advisor">0 files</span>
          </h2>
          <p class="files-card__comment">Shared with you by your mortgage specialist.</p>
        </header>
        <ul class="files-list" data-list="advisor"></ul>
      </section>

      <section class="files-card" aria-labelledby="my-files-title">
        <header class="files-card__header">
          <h2 class="files-card__title" id="my-files-title">
            My uploaded documents
            <span class="files-card__count" data-count="mine">0 uploads</span>
          </h2>
          <p class="files-card__comment">Files you've added to your application.</p>
        </header>
        <ul class="files-list" data-list="mine"></ul>
      </section>
    </div>
  </main>

  <!-- File viewer -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <div class="viewer__backdrop" data-viewer-close></div>
    <div class="viewer__panel">
      <header class="viewer__bar">
        <span class="viewer__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        </span>
        <div class="viewer__heading">
          <h2 class="viewer__title" id="viewer-title"></h2>
          <p class="viewer__meta" data-viewer-meta></p>
        </div>
        <a class="btn btn--outline viewer__download" data-viewer-download hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
          Download
        </a>
        <button class="viewer__close" type="button" data-viewer-close aria-label="Close preview">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="viewer__body" data-viewer-body></div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/uploads-store.js"></script>
  <script src="js/documents-page.js"></script>
</body>
</html>
