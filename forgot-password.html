<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/brand.js"></script>
</head>
<body class="auth-layout">
  <main class="auth">
    <img class="auth__logo" src="assets/brand/figor-logo.svg" alt="Figor" data-brand-logo>

    <section class="auth-card" data-step="request" aria-labelledby="auth-title">
      <span class="auth-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="8.5" r="4.5"/><path d="M12.3 11.7L4 20l2 2M7 17l2 2"/></svg>
      </span>
      <h1 class="auth-card__title" id="auth-title">Forgot password?</h1>
      <p class="auth-card__lede">No worries, we'll send you reset instructions.</p>

      <form class="auth-form" data-auth="forgot" novalidate>
        <div class="auth-field">
          <label for="forgot-email">Email</label>
          <div class="auth-input">
            <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Reset password</button>
      </form>

      <a class="auth-back" href="signin.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Back to login
      </a>
    </section>

    <section class="auth-card" data-step="sent" aria-labelledby="sent-title" hidden>
      <span class="auth-card__icon auth-card__icon--success" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
      </span>
      <h1 class="auth-card__title" id="sent-title" tabindex="-1">Check your email</h1>
      <p class="auth-card__lede">If an account exists for <strong data-sent-email></strong>, we've sent a link to reset your password.</p>
      <a class="btn btn--primary auth-submit" href="signin.html">Back to login</a>
      <p class="auth-resend">Didn't get it? <button type="button" data-resend>Resend email</button> or <button type="button" data-change-email>use a different email</button></p>
    </section>
  </main>

  <div class="auth-visual" aria-hidden="true"></div>

  <script src="js/auth.js"></script>
</body>
</html>
