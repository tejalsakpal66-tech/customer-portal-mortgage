<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/appointments.css">
  <script src="js/brand.js"></script>
</head>
<body data-page="appointments">
  <div id="site-header"></div>

  <main class="page page--compact">
    <div class="appts-head">
      <div>
        <h1 class="page__title">Appointments</h1>
        <p class="appts-lede">Book and manage calls with your mortgage specialist.</p>
      </div>
      <a class="btn btn--primary appts-book" href="appointment-new.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Book an Appointment
      </a>
    </div>

    <section class="appt-next" data-next hidden aria-label="Next appointment"></section>

    <section class="appts-card" aria-label="Your appointments">
      <div class="appts-toolbar">
        <div class="segmented" role="group" aria-label="Show appointments">
          <button class="segmented__btn is-active" type="button" data-filter="all" aria-pressed="true">View all</button>
          <button class="segmented__btn" type="button" data-filter="future" aria-pressed="false">Future</button>
          <button class="segmented__btn" type="button" data-filter="past" aria-pressed="false">Past</button>
        </div>
        <label class="appts-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
          <span class="sr-only">Search appointments</span>
          <input type="search" placeholder="Search" data-search>
        </label>
      </div>

      <div class="appts-table-wrap">
        <table class="appts-table">
          <thead>
            <tr>
              <th scope="col" class="col-id">App. ID</th>
              <th scope="col" class="col-name"><button type="button" class="sort" data-sort="specialist">Mortgage specialist's name<span class="sort__arrow" aria-hidden="true">↑</span></button></th>
              <th scope="col" class="col-date"><button type="button" class="sort" data-sort="date">Discussion on<span class="sort__arrow" aria-hidden="true">↑</span></button></th>
              <th scope="col" class="col-rec"><button type="button" class="sort" data-sort="recordings">Recordings<span class="sort__arrow" aria-hidden="true">↑</span></button></th>
              <th scope="col" class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody data-rows></tbody>
        </table>
      </div>

      <div class="appts-pager">
        <button class="pager-btn" type="button" data-page="prev">Previous</button>
        <span class="appts-pager__label" data-page-label>Page 1 of 1</span>
        <button class="pager-btn" type="button" data-page="next">Next</button>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/appointments.js"></script>
</body>
</html>
