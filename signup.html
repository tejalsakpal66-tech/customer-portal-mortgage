<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/brand.js"></script>
</head>
<body class="auth-layout">
  <main class="auth">
    <img class="auth__logo" src="assets/brand/figor-logo.svg" alt="Figor" data-brand-logo>

    <section class="auth-card auth-card--wide" aria-labelledby="auth-title">
      <h1 class="auth-card__title" id="auth-title">Create your account</h1>
      <p class="auth-card__lede">Please enter your details to register with <span data-brand-name>Figor</span>.</p>

      <form class="auth-form" data-auth="signup" novalidate>
        <div class="auth-row">
          <div class="auth-field">
            <label for="signup-first">First name</label>
            <div class="auth-input"><input id="signup-first" name="firstName" type="text" autocomplete="given-name" required></div>
          </div>
          <div class="auth-field">
            <label for="signup-last">Last name</label>
            <div class="auth-input"><input id="signup-last" name="lastName" type="text" autocomplete="family-name" required></div>
          </div>
        </div>

        <div class="auth-field">
          <label for="signup-email">Email</label>
          <div class="auth-input"><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
        </div>

        <div class="auth-field">
          <label for="signup-phone">Phone</label>
          <div class="auth-input"><input id="signup-phone" name="phone" type="tel" autocomplete="tel" placeholder="+353 87 123 4567" required></div>
        </div>

        <div class="auth-field">
          <label for="signup-password">Password</label>
          <div class="auth-input auth-input--password">
            <input id="signup-password" name="password" type="password" autocomplete="new-password" aria-describedby="signup-rules" required>
            <button class="auth-reveal" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></svg>
              </button>
          </div>
          <ul class="auth-rules" id="signup-rules" aria-label="Password rules">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="cases">Upper and lowercase letters</li>
            <li data-rule="number">A number</li>
            <li data-rule="symbol">A symbol</li>
          </ul>
        </div>

        <div class="auth-field">
          <label for="signup-confirm">Confirm password</label>
          <div class="auth-input auth-input--password">
            <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required>
            <button class="auth-reveal" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></svg>
              </button>
          </div>
        </div>

        <div class="auth-checks">
          <label class="auth-check">
            <input type="checkbox" name="terms" required>
            <span class="auth-check__box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            <span>I agree to the <a class="auth-link" href="documents.html" target="_blank" rel="noopener">Terms of Business</a>.</span>
          </label>
          <label class="auth-check">
            <input type="checkbox" name="privacy" required>
            <span class="auth-check__box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            <span>I acknowledge that I have read the <a class="auth-link" href="documents.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
        </div>

        <button class="btn btn--primary auth-submit" type="submit" disabled>Register</button>
      </form>

      <p class="auth-card__footer">Already have an account? <a class="auth-link" href="signin.html">Sign in</a></p>
    </section>
  </main>

  <div class="auth-visual" aria-hidden="true"></div>

  <script src="js/auth.js"></script>
</body>
</html>
