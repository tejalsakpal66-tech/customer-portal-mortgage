<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/brand.js"></script>
</head>
<body class="auth-layout">
  <main class="auth">
    <img class="auth__logo" src="assets/brand/figor-logo.svg" alt="Figor" data-brand-logo>

    <section class="auth-card" data-step="choose" aria-labelledby="auth-title">
      <span class="auth-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <h1 class="auth-card__title" id="auth-title">Set a new password</h1>
      <p class="auth-card__lede">Your new password must be different from ones you've used before.</p>

      <form class="auth-form" data-auth="reset" novalidate>
        <div class="auth-field">
          <label for="reset-password">New password</label>
          <div class="auth-input auth-input--password">
            <input id="reset-password" name="password" type="password" autocomplete="new-password" aria-describedby="reset-rules" required>
            <button class="auth-reveal" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></svg>
              </button>
          </div>
          <ul class="auth-rules" id="reset-rules" aria-label="Password rules">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="cases">Upper and lowercase letters</li>
            <li data-rule="number">A number</li>
            <li data-rule="symbol">A symbol</li>
          </ul>
        </div>

        <div class="auth-field">
          <label for="reset-confirm">Confirm new password</label>
          <div class="auth-input auth-input--password">
            <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required>
            <button class="auth-reveal" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></svg>
              </button>
          </div>
        </div>

        <button class="btn btn--primary auth-submit" type="submit" disabled>Reset password</button>
      </form>

      <a class="auth-back" href="signin.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Back to login
      </a>
    </section>

    <section class="auth-card" data-step="done" aria-labelledby="done-title" hidden>
      <span class="auth-card__icon auth-card__icon--success" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <h1 class="auth-card__title" id="done-title" tabindex="-1">Password reset</h1>
      <p class="auth-card__lede">Your password has been changed. You can now sign in with your new password.</p>
      <a class="btn btn--primary auth-submit" href="signin.html">Continue to sign in</a>
    </section>
  </main>

  <div class="auth-visual" aria-hidden="true"></div>

  <script src="js/auth.js"></script>
</body>
</html>
