<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | Figor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/profile.css">
  <script src="js/brand.js"></script>
</head>
<body data-page="profile" data-account-page="password">
  <div id="site-header"></div>

  <main class="page page--compact">
    <div class="profile-head">
      <h1 class="page__title profile-title">My account</h1>
      <p class="profile-lede">Your details, consents, data and sign-in settings.</p>
    </div>

    <div class="profile-grid">
      <aside class="profile-side" data-account-side></aside>

      <div class="profile-sections">
        <section class="profile-card" id="password" aria-labelledby="password-title">
          <header class="profile-card__head">
            <div>
              <h2 class="profile-card__title" id="password-title">Change password</h2>
              <p class="profile-card__desc" data-password-meta>Last changed 12 Aug 2026</p>
            </div>
          </header>

          <form class="profile-form" data-password-form novalidate>
            <div class="profile-form__grid">
              <div class="profile-field profile-field--wide">
                <label for="pw-current">Current password</label>
                <input id="pw-current" type="password" autocomplete="current-password" required>
              </div>
              <div class="profile-field">
                <label for="pw-new">New password</label>
                <input id="pw-new" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-rules">
              </div>
              <div class="profile-field">
                <label for="pw-confirm">Confirm new password</label>
                <input id="pw-confirm" type="password" autocomplete="new-password" required>
              </div>
            </div>
            <ul class="pw-rules" id="pw-rules">
              <li data-rule="length">At least 8 characters</li>
              <li data-rule="mix">Letters and numbers</li>
              <li data-rule="match">Both new passwords match</li>
            </ul>
            <p class="profile-form__error" data-password-error hidden></p>
            <div class="profile-form__actions">
              <button class="btn btn--text" type="reset">Cancel</button>
              <button class="btn btn--primary" type="submit">Update password</button>
            </div>
          </form>

          <div class="security-row">
            <span class="security-row__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
            </span>
            <div class="security-row__text">
              <p class="security-row__label">Two-step verification</p>
              <p class="security-row__meta">A code is sent to your mobile each time you sign in</p>
            </div>
            <span class="security-row__status">On</span>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="profile-toast" role="status" aria-live="polite" data-toast hidden></div>

  <script src="js/layout.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
